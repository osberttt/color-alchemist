<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Craft art preview</title>
    <!-- Dev-only preview: open http://localhost:5173/docs/previews/crafts.html with `npm run dev` to see the crafts move. -->
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1c1b22;
        color: #eee;
        font: 14px system-ui, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 14px;
        color: #a9a9b3;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 240px);
        gap: 10px 18px;
      }
      .cell {
        display: grid;
        justify-items: center;
        gap: 2px;
        text-align: center;
      }
      .craft-stage {
        width: 240px;
        height: 240px;
      }
      .name {
        font-weight: 700;
      }
      .blurb {
        color: #9a9aa5;
        font-style: italic;
        font-size: 12px;
      }
      button {
        font: inherit;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Craft art: Prima Materia → Magnum Opus</h1>
    <p>Each row is one random palette, on its own background, as on a game page: the craft uses that page's colors, more of them and a little brighter rank by rank. New shapes every render.</p>
    <button type="button" id="roll">Re-roll</button>
    <div id="grid"></div>
    <script type="module">
      import { CRAFT_BLURBS, craftName, craftSvg } from '/src/ui/craft.ts';
      import { PALETTES } from '/src/ui/palettes.ts';
      import '/src/ui/craft-anim.css';

      const grid = document.getElementById('grid');
      function roll() {
        grid.replaceChildren();
        const picks = [...PALETTES].sort(() => Math.random() - 0.5).slice(0, 3);
        picks.forEach((pal, row) => {
          const band = document.createElement('div');
          band.className = 'grid';
          band.style.cssText = `background:${pal.bg};color:${pal.fg};padding:8px 12px;border-radius:14px;margin-bottom:10px`;
          const label = document.createElement('p');
          label.style.cssText = `grid-column:1/-1;margin:0;color:${pal.fg};font-weight:700`;
          label.textContent = pal.name;
          band.append(label);
          for (let tier = 0; tier < 5; tier++) {
            const cell = document.createElement('figure');
            cell.className = 'cell';
            cell.style.margin = '0';
            cell.innerHTML = `<div class="craft-stage">${craftSvg(tier, pal)}</div>` + (row === 2 ? `<span class="name">${craftName(tier)}</span><span class="blurb" style="color:inherit;opacity:.75">${CRAFT_BLURBS[tier]}</span>` : '');
            band.append(cell);
          }
          grid.append(band);
        });
      }
      document.getElementById('roll').addEventListener('click', roll);
      roll();
    </script>
  </body>
</html>
